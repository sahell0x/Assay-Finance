# Frontend only: the Next server, nothing else.
#
#   docker compose up --build
#
# Put NEXT_PUBLIC_API_URL, BACKEND_URL and WEB_HOST_PORT in frontend/.env. In production
# the browser calls the backend subdomain directly, for example https://api.xyz.in.
name: equity-research-agent-frontend

services:
  web:
    restart: unless-stopped
    build:
      context: .
      args:
        # A build argument, NOT an `environment:` entry, and that distinction is the
        # whole point. Next inlines NEXT_PUBLIC_* into the client bundle during
        # `next build`; by runtime, process.env.NEXT_PUBLIC_API_URL no longer exists as
        # a lookup -- it has already been substituted with a string literal. Setting it
        # as a runtime environment variable changes nothing at all.
        #
        # The corollary: pointing the app at a different API requires a rebuild, not a
        # restart. `docker compose up --build`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Server-side fetches use the Docker service name when the stack is started
        # from the repo root.
        BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    environment:
      # The same value at runtime, for this server's own server-rendered fetches.
      # Under the root compose file the api service is on the same network and answers
      # to `api`; on its own, point this at wherever the backend actually is.
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      # busybox wget, because node:22-alpine has no curl. "/" is statically prerendered
      # at build time, so this probes the Next server without going anywhere near the
      # backend -- the container must not report unhealthy just because the api is down.
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
