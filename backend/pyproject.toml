[project]
name = "equity-research-agent"
version = "0.1.0"
description = "Automated equity research analyst: quantitative pipeline + cited RAG memo."
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # error monitoring; inert unless SENTRY_DSN is set
    "sentry-sdk[fastapi]>=2.0",
    # data / persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    # queue / cache
    "redis>=5.2",
    "arq>=0.26",
    # agent
    "langgraph>=0.2.60",
    "openai>=1.59",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # market data
    "yfinance>=0.2.51",
    "pandas>=2.2",
    "numpy>=1.26",
    # auth
    "fastapi-users[sqlalchemy,oauth]>=14.0",
    # misc
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the API tests share a session-scoped engine,
# and a per-function loop would leave its connections bound to a loop that is gone.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
    "ignore::FutureWarning:yfinance.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501"]
